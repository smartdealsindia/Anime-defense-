
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Anime Defense: Shadow War</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101326;color:#fff;font-family:Arial,sans-serif;text-align:center}
header{padding:12px 8px;background:#1b2040}
h1{font-size:23px;margin:2px;color:#ffd86b}
#stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px;font-weight:bold}
.stat{background:#262c50;border-radius:9px;padding:8px 11px}
#gameWrap{width:100%;max-width:950px;margin:auto;padding:0 6px}
canvas{display:block;width:100%;height:auto;border:2px solid #6574b9;border-radius:10px;background:#18213a;touch-action:manipulation}
#controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px 4px}
button{border:0;border-radius:9px;padding:12px 15px;font-size:14px;font-weight:bold;color:white;background:#5758d9;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
#buildBtn{background:#d17b25}
#restartBtn{background:#bd3d65}
#message{min-height:25px;color:#ffe69b;font-size:14px;padding:0 8px 12px}
small{display:block;color:#c6c9e8;padding:0 12px 15px}
</style>
</head>
<body>
<header>
<h1>⚔️ Anime Defense: Shadow War</h1>
<div>Defend the gate. Survive every wave!</div>
</header>

<div id="stats">
<div class="stat">❤️ Lives: <span id="lives">10</span></div>
<div class="stat">🪙 Coins: <span id="coins">100</span></div>
<div class="stat">🌟 Level: <span id="level">1</span></div>
<div class="stat">👾 Wave: <span id="wave">1</span>/3</div>
</div>

<div id="gameWrap">
<canvas id="game" width="900" height="570"></canvas>
</div>

<div id="controls">
<button id="heroBtn">🦸 Move Hero</button>
<button id="buildBtn">🏹 Build Tower (40)</button>
<button id="startBtn">▶ Start / Next Wave</button>
<button id="restartBtn">↻ Restart Run</button>
</div>
<div id="message">Tap the field to move your hero. Build towers away from the road.</div>
<small>Progress is saved automatically on this device. Clear 3 waves to advance to the next level.</small>

<script>
"use strict";

(() => {
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

if (!ctx) {
  document.getElementById("message").textContent =
    "Your browser could not start the game canvas. Please open this page in Chrome.";
  return;
}

const W = canvas.width, H = canvas.height;
const $ = id => document.getElementById(id);
const SAVE_KEY = "animeShadowWar_fixed_v1";

const path = [
  {x:-20,y:105},{x:150,y:105},{x:150,y:225},
  {x:335,y:225},{x:335,y:110},{x:530,y:110},
  {x:530,y:355},{x:710,y:355},{x:710,y:475},{x:880,y:475}
];

const themes = [
  {name:"Mystic Forest",bg:"#183b3b",road:"#b59a6a",accent:"#60e6a3"},
  {name:"Flame Valley",bg:"#49252e",road:"#b58a76",accent:"#ff9065"},
  {name:"Moon Temple",bg:"#25234e",road:"#8d88bd",accent:"#c6a7ff"},
  {name:"Frozen Realm",bg:"#174052",road:"#9bbdc9",accent:"#8df0ff"},
  {name:"Shadow Castle",bg:"#28233b",road:"#93879e",accent:"#ffcf74"}
];

let level = 1, wave = 1, coins = 100, lives = 10;
let enemies = [], towers = [], shots = [], particles = [];
let hero = {x:75,y:390,hp:100,maxHp:100,cooldown:0};
let running = false, gameOver = false, buildMode = false;
let spawnLeft = 0, spawnTimer = 0, waveWait = 0;
let kills = 0, lastTime = 0, heroMoveMode = false;
let messageTimer = 0;

function loadProgress() {
  try {
    const data = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (data) {
      level = Math.max(1, Math.min(999, Number(data.level) || 1));
      coins = Math.max(0, Number(data.coins) || 100);
      kills = Math.max(0, Number(data.kills) || 0);
    }
  } catch (e) {
    // If storage is unavailable, the game still runs normally.
  }
}

function saveProgress() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({level, coins, kills}));
  } catch (e) {}
}

function say(text) {
  $("message").textContent = text;
  messageTimer = 3;
}

function updateUI() {
  $("lives").textContent = lives;
  $("coins").textContent = coins;
  $("level").textContent = level;
  $("wave").textContent = wave;
}

function distance(a,b) {
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function pointOnPath(p) {
  for (let i=0;i<path.length-1;i++) {
    const a=path[i], b=path[i+1];
    const dx=b.x-a.x, dy=b.y-a.y;
    const len2=dx*dx+dy*dy;
    const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(len2||1)));
    const q={x:a.x+t*dx,y:a.y+t*dy};
    if (distance(p,q)<43) return true;
  }
  return false;
}

function startWave() {
  if (gameOver) {
    say("Run over! Press Restart Run to play again.");
    return;
  }
  if (running) {
    say("The current wave is already running!");
    return;
  }
  running = true;
  spawnLeft = 5 + level*2 + wave*2;
  spawnTimer = 0.2;
  waveWait = 0;
  say("Wave "+wave+" begins! Defend the gate!");
  updateUI();
}

function spawnEnemy() {
  const boss = spawnLeft % 8 === 0 && level >= 2;
  const hp = boss ? 180 + level*35 : 35 + level*11 + wave*5;
  enemies.push({
    x:path[0].x, y:path[0].y, segment:1,
    hp:hp, maxHp:hp,
    speed:boss ? 25 : 39 + level*1.5,
    reward:boss ? 30 : 8,
    boss:boss, radius:boss ? 19 : 13
  });
  spawnLeft--;
}

function nearestEnemy(x,y,range) {
  let best=null, bestDist=Infinity;
  for (const e of enemies) {
    const d=Math.hypot(e.x-x,e.y-y);
    if (e.hp>0 && d<range && d<bestDist) {
      best=e; bestDist=d;
    }
  }
  return best;
}

function fire(x,y,target,damage,speed,color) {
  shots.push({x,y,target,damage,speed,color});
}

function buildTower(x,y) {
  if (coins<40) {
    say("Not enough coins! Defeat enemies to earn more.");
    return;
  }
  if (pointOnPath({x,y}) || distance({x,y},hero)<40 ||
      towers.some(t=>distance(t,{x,y})<35)) {
    say("Build on an empty area away from the road and hero.");
    return;
  }
  if (x<25||x>W-25||y<25||y>H-25) return;
  towers.push({x,y,cooldown:0,range:155,damage:19,level:1});
  coins-=40;
  buildMode=false;
  $("buildBtn").textContent="🏹 Build Tower (40)";
  say("Tower built! It will automatically attack enemies.");
  updateUI();
  saveProgress();
}

function moveHero(x,y) {
  hero.x=Math.max(25,Math.min(W-25,x));
  hero.y=Math.max(25,Math.min(H-25,y));
  heroMoveMode=false;
  say("Hero moved!");
}

function handleCanvasTap(ev) {
  ev.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const x=(ev.clientX-rect.left)*W/rect.width;
  const y=(ev.clientY-rect.top)*H/rect.height;
  if (gameOver) return;
  if (buildMode) {
    buildTower(x,y);
  } else if (heroMoveMode) {
    moveHero(x,y);
  } else {
    // Tap anywhere to reposition the hero.
    moveHero(x,y);
  }
}
canvas.addEventListener("pointerdown",handleCanvasTap);

$("buildBtn").addEventListener("click",()=>{
  if (gameOver) return;
  buildMode=!buildMode;
  heroMoveMode=false;
  $("buildBtn").textContent=buildMode ? "✖ Cancel Building" : "🏹 Build Tower (40)";
  say(buildMode ? "Tap an empty area to build a tower." : "Building cancelled.");
});

$("heroBtn").addEventListener("click",()=>{
  if (gameOver) return;
  buildMode=false;
  heroMoveMode=true;
  $("buildBtn").textContent="🏹 Build Tower (40)";
  say("Tap anywhere on the field to move your hero.");
});

$("startBtn").addEventListener("click",startWave);

$("restartBtn").addEventListener("click",()=>{
  if (!confirm("Restart the run? Your saved level and coins will be reset.")) return;
  level=1; wave=1; coins=100; lives=10;
  enemies=[]; towers=[]; shots=[]; particles=[];
  hero={x:75,y:390,hp:100,maxHp:100,cooldown:0};
  running=false; gameOver=false; spawnLeft=0; spawnTimer=0;
  waveWait=0; kills=0; buildMode=false; heroMoveMode=false;
  saveProgress(); updateUI();
  $("buildBtn").textContent="🏹 Build Tower (40)";
  say("New run started. Press Start / Next Wave!");
});

function update(dt) {
  if (messageTimer>0) messageTimer-=dt;

  if (!running || gameOver) return;

  if (spawnLeft>0) {
    spawnTimer-=dt;
    if (spawnTimer<=0) {
      spawnEnemy();
      spawnTimer=Math.max(0.48,1.05-level*0.025);
    }
  }

  // Move enemies along the road.
  for (const e of enemies) {
    if (e.hp<=0) continue;
    const target=path[e.segment];
    if (!target) {
      e.hp=0;
      lives--;
      say("An enemy reached the gate! You lost a life.");
      if (lives<=0) {
        lives=0;
        gameOver=true;
        running=false;
        say("GAME OVER! Press Restart Run to try again.");
      }
      continue;
    }

    const dx=target.x-e.x, dy=target.y-e.y;
    const d=Math.hypot(dx,dy);
    const step=e.speed*dt;
    if (d<=step+1) {
      e.x=target.x; e.y=target.y;
      e.segment++;
    } else {
      e.x+=(dx/d)*step;
      e.y+=(dy/d)*step;
    }
  }

  // Hero auto-attacks the nearest enemy.
  hero.cooldown-=dt;
  if (hero.cooldown<=0) {
    const target=nearestEnemy(hero.x,hero.y,245);
    if (target) {
      fire(hero.x,hero.y-13,target,24+level*2,340,"#78f7ff");
      hero.cooldown=0.48;
    }
  }

  // Towers auto-attack.
  for (const t of towers) {
    t.cooldown-=dt;
    if (t.cooldown<=0) {
      const target=nearestEnemy(t.x,t.y,t.range);
      if (target) {
        fire(t.x,t.y,target,t.damage,285,"#ffd76a");
        t.cooldown=0.85;
      }
    }
  }

  // Move projectiles and apply damage.
  for (const s of shots) {
    if (!s.target || s.target.hp<=0) {
      s.dead=true;
      continue;
    }
    const dx=s.target.x-s.x, dy=s.target.y-s.y;
    const d=Math.hypot(dx,dy);
    if (d<10) {
      s.target.hp-=s.damage;
      s.dead=true;
      for(let i=0;i<3;i++) particles.push({
        x:s.x,y:s.y,vx:(Math.random()-.5)*70,
        vy:(Math.random()-.5)*70,life:.25,color:s.color
      });
    } else {
      s.x+=(dx/d)*s.speed*dt;
      s.y+=(dy/d)*s.speed*dt;
    }
  }
  shots=shots.filter(s=>!s.dead);

  // Reward defeated enemies.
  for (const e of enemies) {
    if (e.hp<=0 && !e.rewarded) {
      e.rewarded=true;
      if (e.segment<path.length) {
        coins+=e.reward;
        kills++;
      }
    }
  }
  enemies=enemies.filter(e=>e.hp>0);

  for (const p of particles) {
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);

  // Finish a wave only after all enemies have spawned and been cleared.
  if (spawnLeft<=0 && enemies.length===0) {
    running=false;
    if (wave<3) {
      wave++;
      coins+=25;
      say("Wave cleared! +25 coins. Press Start / Next Wave.");
    } else {
      level++;
      wave=1;
      coins+=60;
      say("LEVEL COMPLETE! Welcome to "+themes[(level-1)%themes.length].name+"! +60 coins.");
    }
    saveProgress();
  }

  updateUI();
}

function drawBackground() {
  const theme=themes[(level-1)%themes.length];
  ctx.fillStyle=theme.bg;
  ctx.fillRect(0,0,W,H);

  // Background decorations.
  for(let i=0;i<34;i++) {
    const x=(i*137+37)%W, y=(i*83+22)%H;
    ctx.globalAlpha=.25;
    ctx.fillStyle=theme.accent;
    ctx.beginPath(); ctx.arc(x,y,2+(i%4),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // Landscape details.
  for(let i=0;i<12;i++) {
    const x=(i*89+25)%W, y=(i*71+45)%H;
    if (pointOnPath({x,y})) continue;
    ctx.fillStyle=theme.accent;
    ctx.globalAlpha=.2;
    ctx.beginPath();
    ctx.arc(x,y,8+(i%3)*3,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }

  // Road base.
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle="#352f43"; ctx.lineWidth=62;
  ctx.beginPath();
  path.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.stroke();

  ctx.strokeStyle=theme.road; ctx.lineWidth=48;
  ctx.beginPath();
  path.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.stroke();

  ctx.strokeStyle="rgba(255,255,255,.20)";
  ctx.lineWidth=2; ctx.setLineDash([12,12]);
  ctx.beginPath();
  path.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.stroke(); ctx.setLineDash([]);

  // Gate.
  ctx.fillStyle="#e9e7ff";
  ctx.fillRect(827,430,45,85);
  ctx.fillStyle="#443b6b";
  ctx.fillRect(836,440,27,65);
  ctx.fillStyle="#ffdf70";
  ctx.font="bold 14px Arial";
  ctx.fillText("GATE",832,424);

  ctx.fillStyle="rgba(255,255,255,.8)";
  ctx.font="bold 17px Arial";
  ctx.fillText(theme.name,15,27);
  ctx.font="13px Arial";
  ctx.fillText("Defend the gate!",15,47);
}

function drawHero() {
  const x=hero.x, y=hero.y;
  // Shadow.
  ctx.fillStyle="rgba(0,0,0,.3)";
  ctx.beginPath(); ctx.ellipse(x,y+12,22,8,0,0,Math.PI*2); ctx.fill();

  // Cape and body.
  ctx.fillStyle="#eb4779";
  ctx.beginPath();
  ctx.moveTo(x-9,y-3); ctx.lineTo(x-21,y+13);
  ctx.lineTo(x+3,y+10); ctx.closePath(); ctx.fill();

  ctx.fillStyle="#49d6ff";
  ctx.fillRect(x-10,y-2,20,22);

  // Face.
  ctx.fillStyle="#f7c79d";
  ctx.beginPath(); ctx.arc(x,y-13,12,0,Math.PI*2); ctx.fill();

  // Hair.
  ctx.fillStyle="#34234e";
  ctx.beginPath();
  ctx.moveTo(x-12,y-14); ctx.lineTo(x-10,y-27);
  ctx.lineTo(x-2,y-22); ctx.lineTo(x+5,y-28);
  ctx.lineTo(x+12,y-17); ctx.lineTo(x+8,y-10);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle="#29274d";
  ctx.fillRect(x-6,y-14,3,3); ctx.fillRect(x+4,y-14,3,3);

  // Energy aura.
  ctx.strokeStyle="#8bf8ff"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y,26,0,Math.PI*2); ctx.stroke();

  // Health bar.
  ctx.fillStyle="#422";
  ctx.fillRect(x-20,y-38,40,5);
  ctx.fillStyle="#5cff91";
  ctx.fillRect(x-20,y-38,40*Math.max(0,hero.hp/hero.maxHp),5);
  ctx.fillStyle="#fff";
  ctx.font="bold 11px Arial";
  ctx.fillText("HERO",x-15,y-43);
}

function drawEnemy(e) {
  const x=e.x,y=e.y;
  ctx.fillStyle="rgba(0,0,0,.3)";
  ctx.beginPath(); ctx.ellipse(x,y+10,e.radius+3,6,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle=e.boss?"#a64aff":"#ff526d";
  ctx.beginPath(); ctx.arc(x,y,e.radius,0,Math.PI*2); ctx.fill();

  ctx.fillStyle=e.boss?"#ffda6b":"#ffe9a3";
  ctx.beginPath();
  ctx.moveTo(x-e.radius+3,y-e.radius+1);
  ctx.lineTo(x-e.radius-4,y-e.radius-9);
  ctx.lineTo(x-2,y-e.radius-5);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+e.radius-3,y-e.radius+1);
  ctx.lineTo(x+e.radius+4,y-e.radius-9);
  ctx.lineTo(x+2,y-e.radius-5);
  ctx.fill();

  ctx.fillStyle="#2a1534";
  ctx.fillRect(x-7,y-3,4,5); ctx.fillRect(x+3,y-3,4,5);

  ctx.fillStyle="#301b30";
  ctx.fillRect(x-17,y-e.radius-11,34,5);
  ctx.fillStyle="#69ff90";
  ctx.fillRect(x-17,y-e.radius-11,34*Math.max(0,e.hp/e.maxHp),5);

  if(e.boss) {
    ctx.fillStyle="#fff";
    ctx.font="bold 10px Arial";
    ctx.fillText("BOSS",x-13,y-e.radius-15);
  }
}

function drawTower(t) {
  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.beginPath(); ctx.ellipse(t.x,t.y+9,22,9,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle="#ffd76a";
  ctx.beginPath(); ctx.arc(t.x,t.y,20,0,Math.PI*2); ctx.fill();

  ctx.fillStyle="#5045b9";
  ctx.fillRect(t.x-9,t.y-17,18,27);

  ctx.fillStyle="#fff0b0";
  ctx.beginPath(); ctx.arc(t.x,t.y-7,7,0,Math.PI*2); ctx.fill();

  ctx.fillStyle="#292044";
  ctx.fillRect(t.x-4,t.y-9,3,3); ctx.fillRect(t.x+3,t.y-9,3,3);

  ctx.strokeStyle="rgba(255,215,106,.4)";
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(t.x,t.y,24,0,Math.PI*2); ctx.stroke();
}

function draw() {
  drawBackground();

  for(const t of towers) drawTower(t);
  for(const e of enemies) drawEnemy(e);
  drawHero();

  for(const s of shots) {
    ctx.fillStyle=s.color;
    ctx.beginPath(); ctx.arc(s.x,s.y,5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=.3;
    ctx.beginPath(); ctx.arc(s.x,s.y,10,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  for(const p of particles) {
    ctx.globalAlpha=Math.max(0,p.life/.25);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  if(buildMode) {
    ctx.fillStyle="rgba(255,215,106,.95)";
    ctx.font="bold 17px Arial";
    ctx.fillText("BUILD MODE: tap an empty area",W/2-140,30);
  } else if(heroMoveMode) {
    ctx.fillStyle="#9ffaff";
    ctx.font="bold 17px Arial";
    ctx.fillText("MOVE HERO: tap your destination",W/2-140,30);
  }

  if(!running && !gameOver) {
    ctx.fillStyle="rgba(10,10,25,.55)";
    ctx.fillRect(260,260,380,65);
    ctx.fillStyle="#fff";
    ctx.textAlign="center";
    ctx.font="bold 22px Arial";
    ctx.fillText("LEVEL "+level+"  •  WAVE "+wave,450,286);
    ctx.font="15px Arial";
    ctx.fillText("Press Start / Next Wave",450,308);
    ctx.textAlign="left";
  }

  if(gameOver) {
    ctx.fillStyle="rgba(5,5,20,.78)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#ff6b91";
    ctx.textAlign="center";
    ctx.font="bold 44px Arial";
    ctx.fillText("GAME OVER",W/2,H/2-10);
    ctx.fillStyle="#fff";
    ctx.font="bold 19px Arial";
    ctx.fillText("Press Restart Run to play again",W/2,H/2+28);
    ctx.textAlign="left";
  }
}

function loop(timestamp) {
  const dt=lastTime ? Math.min((timestamp-lastTime)/1000,.04) : 0;
  lastTime=timestamp;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

loadProgress();
updateUI();
say("Welcome! Press Start / Next Wave to begin.");
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
